plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.github.node-gradle.node' version '7.0.1'
}

group = 'com.simplechess'
version = '0.0.1'

// Ensure we're using Java 21
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.jfree:jfreechart:1.5.4'

    // Modern API documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // JSON processing
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

// Node.js configuration
node {
    version = '20.10.0'
    npmVersion = '10.2.3'
    download = true
    workDir = file("${project.buildDir}/nodejs")
    npmWorkDir = file("${project.buildDir}/npm")
}

// JavaScript test configuration
task installJestDependencies(type: NpmTask) {
    description = 'Install Jest and testing dependencies'
    args = ['install', '--save-dev', 'jest@29.7.0', 'jest-environment-jsdom@29.7.0']
    inputs.file('package.json')
    outputs.dir('node_modules')
}

task runJavaScriptTests(type: NpmTask) {
    dependsOn installJestDependencies
    description = 'Run JavaScript unit tests with Jest'
    args = ['test']
    inputs.dir('src/test/resources/static/js')
    outputs.dir('build/test-results/javascript')
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn runJavaScriptTests
}

jar {
    archiveBaseName = 'simply-chess'
    archiveVersion = '0.0.1'
}

task stage(type: Copy, dependsOn: [clean, build]) {
    from jar.archiveFile
    into project.rootDir
    rename {
        'app.jar'
    }
}

stage.mustRunAfter(clean)

tasks.register('cleanAppJar', Delete) {
    delete 'app.jar'
}

clean.dependsOn cleanAppJar
